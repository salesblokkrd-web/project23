<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПРОЕКТ 23 — интро</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/';</script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
@font-face{font-family:'Geologica';font-weight:700 800;src:url('Geologica-cyr.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Geologica';font-weight:700 800;src:url('Geologica-lat.woff2') format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'JBMono';font-weight:400 700;src:url('JetBrainsMono-cyr.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'JBMono';font-weight:400 700;src:url('JetBrainsMono-lat.woff2') format('woff2');unicode-range:U+0000-00FF}
:root{--acc:#2DD4BF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Geologica',sans-serif}
#cesiumContainer{position:fixed;inset:0}
.cesium-widget-credits,.cesium-credit-lightbox-overlay{display:none!important}
/* виньетка + сканлайны «спутникового сигнала» */
.fx{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .6s}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(2,6,14,.5) 100%)}
.fx::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,220,210,.045) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.recticle{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);opacity:0}
.recticle .cor{position:absolute;width:26px;height:26px;border:2px solid var(--acc)}
.recticle .k1{left:0;top:0;border-right:none;border-bottom:none}
.recticle .k2{right:0;top:0;border-left:none;border-bottom:none}
.recticle .k3{left:0;bottom:0;border-right:none;border-top:none}
.recticle .k4{right:0;bottom:0;border-left:none;border-top:none}
.recticle .cx,.recticle .cy{position:absolute;background:var(--acc);opacity:.8}
.recticle .cx{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
.recticle .cy{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
.recticle .dot{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--acc)}
.coord{position:absolute;left:50%;top:calc(50% + 92px);transform:translateX(-50%);
  font-family:'JBMono',monospace;font-size:15px;letter-spacing:.22em;color:var(--acc);
  text-transform:uppercase;white-space:nowrap;opacity:0;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.scan{position:absolute;left:0;right:0;top:34px;text-align:center;
  font-family:'JBMono',monospace;font-size:11px;letter-spacing:.4em;color:rgba(150,230,220,.55);
  text-transform:uppercase;opacity:0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.alt{position:absolute;right:34px;top:50%;transform:translateY(-50%);
  font-family:'JBMono',monospace;font-size:12px;letter-spacing:.16em;color:rgba(150,230,220,.6);
  text-align:right;opacity:0;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap}
.flash{position:fixed;inset:0;background:#eafcfd;opacity:0;z-index:6;pointer-events:none}
.logo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;z-index:7;opacity:0;background:#0B1F3A}
.logo .cross{position:relative;width:92px;height:92px;flex:0 0 auto}
.logo .cross .lx,.logo .cross .ly{position:absolute;left:50%;top:50%;background:var(--acc)}
.logo .cross .lx{width:56px;height:4px;transform:translate(-50%,-50%)}
.logo .cross .ly{height:56px;width:4px;transform:translate(-50%,-50%)}
.logo .cross .rr{position:absolute;left:50%;top:50%;width:36px;height:36px;border:4px solid var(--acc);border-radius:50%;background:#0B1F3A;transform:translate(-50%,-50%)}
.logo .wm{display:flex;flex-direction:column;gap:10px}
.logo .wm .l1{font-family:'Geologica';font-weight:800;font-size:76px;color:#F0F5F9;letter-spacing:-.01em;line-height:.9}
.logo .wm .l1 b{color:var(--acc)}
.logo .wm .l2{font-family:'JBMono';font-weight:500;font-size:15px;letter-spacing:.22em;color:#8298B0;text-transform:uppercase}
.skip{position:fixed;right:24px;bottom:22px;z-index:8;pointer-events:auto;
  font-family:'JBMono',monospace;font-size:11px;letter-spacing:.16em;color:rgba(180,210,220,.6);
  text-transform:uppercase;cursor:pointer;border:1px solid rgba(180,210,220,.25);
  padding:8px 14px;border-radius:4px;background:rgba(6,14,22,.4);transition:.2s}
.skip:hover{color:#fff;border-color:var(--acc)}
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div class="fx" id="fx"></div>
<div class="hud">
  <div class="scan" id="scan">[ спутниковое наведение ]</div>
  <div class="alt" id="alt"></div>
  <div class="recticle" id="rec">
    <span class="cx"></span><span class="cy"></span>
    <span class="cor k1"></span><span class="cor k2"></span><span class="cor k3"></span><span class="cor k4"></span>
    <span class="dot"></span>
  </div>
  <div class="coord" id="coord"><span id="coordtxt"></span></div>
</div>
<div class="flash" id="flash"></div>
<div class="logo" id="logo">
  <div class="cross"><span class="lx"></span><span class="ly"></span><span class="rr"></span></div>
  <div class="wm"><div class="l1">ПРОЕКТ&nbsp;<b>23</b></div><div class="l2">45.03° N · 38.97° E · Краснодар</div></div>
</div>
<div class="skip" id="skip">Пропустить →</div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Cesium.js"></script>
<script>
// Cesium без Ion — спутниковые тайлы напрямую с ESRI World Imagery (без токена)
Cesium.Ion.defaultAccessToken = undefined;

const rec = document.getElementById('rec');
const coord = document.getElementById('coord');
const coordtxt = document.getElementById('coordtxt');
const scan = document.getElementById('scan');
const alt = document.getElementById('alt');
const flash = document.getElementById('flash');
const logoEl = document.getElementById('logo');
const skip = document.getElementById('skip');
const fx = document.getElementById('fx');

const KRD_LON = 38.9769, KRD_LAT = 45.0355;
const COORD_FULL = '45.03° N · 38.97° E · КРАСНОДАР';
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));

const viewer = new Cesium.Viewer('cesiumContainer', {
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.ArcGisMapServerImageryProvider.fromUrl(
      'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer')),
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
  navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:false,
  infoBox:false, selectionIndicator:false, navigationInstructionsInitiallyVisible:false,
  requestRenderMode:false, contextOptions:{webgl:{alpha:false}}
});
const scene = viewer.scene;
window.__viewer = viewer;   // для отладки из playwright
scene.skyAtmosphere.show = true;
scene.globe.showGroundAtmosphere = true;
scene.globe.enableLighting = false;         // равномерно освещено — всегда читаемо
scene.globe.baseColor = Cesium.Color.BLACK;
scene.screenSpaceCameraController.enableInputs = false;  // зритель не крутит
scene.postProcessStages.fxaa.enabled = true;
viewer.cesiumWidget.creditContainer.style.display = 'none';
// цвет фона космоса
scene.backgroundColor = Cesium.Color.BLACK;

// дальняя точка старта — планета МАЛЕНЬКАЯ в звёздах, потом растёт
const H_START = 160000000;  // 160 000 км — Земля точкой
const H_END   = 3500;       // 3.5 км над центром — город крупно, читаются кварталы
// стартовая долгота НЕ краснодарская (Атлантика) — чтобы был виден доворот на Краснодар
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(-40, 12, H_START),
  orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-90), roll: 0 }
});

let phase = 'wait';            // wait → spin (Земля крутится) → fly (влёт на Краснодар) → done
let finished = false;
let spinT = 0, lastT = performance.now();
// ручная траектория (flyTo не даёт экспоненциального профиля высоты → рост неравномерный)
let spinLon = -40, flyP = 0, startLon = -40;
const SPIN_RATE = 20;    // °/с — вращение Земли в фазе spin
const START_LAT = 12;    // широта обзора в начале (экватор-ish)
const FLY_DUR   = 7.5;   // с — влёт из космоса до города
const smooth = x => x*x*(3 - 2*x);   // smoothstep для мягких концов доворота

function setCam(lon, lat, h){
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, h),
    orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-90), roll: 0 }
  });
}

// у земли дождаться прогрузки детальных тайлов (макс. 2.5 с), чтобы финальный кадр был резким
function waitTilesThenFinish(){
  let tries = 0;
  const iv = setInterval(()=>{
    tries++;
    if(scene.globe.tilesLoaded || tries > 60){ clearInterval(iv); finishSeq(); }
  }, 100);
}

// HUD привязан к ВЫСОТЕ камеры — синхронно с реальным полётом и подгрузкой тайлов
scene.preRender.addEventListener(function(){
  const now = performance.now();
  const dt = Math.min((now - lastT)/1000, 0.05); lastT = now;

  // ── фаза вращения: планета маленькая и КРУТИТСЯ, пока камера далеко ──
  if(phase === 'spin'){
    spinT += dt;
    spinLon += SPIN_RATE*dt;                 // долгота под камерой растёт → Земля крутится
    setCam(spinLon, START_LAT, H_START);
    if(spinT > 3.0){ phase = 'fly'; startLon = spinLon; }
    return;
  }
  if(phase !== 'fly' || finished) return;

  // ── влёт: экспоненциальная высота (равномерный рост планеты) + доворот на Краснодар ──
  flyP += dt / FLY_DUR;
  const p = clamp(flyP, 0, 1);
  const h = H_START * Math.pow(H_END / H_START, p);           // экспонента → равномерный зум
  const lon = startLon + (KRD_LON - startLon) * smooth(p);    // доворот к Краснодару
  const lat = START_LAT + (KRD_LAT - START_LAT) * smooth(p);
  setCam(lon, lat, h);
  if(p >= 1 && phase === 'fly'){ phase = 'done'; waitTilesThenFinish(); }

  // прогресс сближения по логарифму высоты: g=0 далеко(космос) → g=1 у земли
  const g = clamp((Math.log(H_START) - Math.log(h)) / (Math.log(H_START) - Math.log(H_END)), 0, 1);

  // «спутниковый сигнал» + сканлайны включаются ближе к земле
  const sig = clamp((g - 0.55) / 0.15, 0, 1);
  fx.style.opacity = sig; scan.style.opacity = sig;

  // высотомер (живой): км → м
  if(g > 0.32){
    alt.style.opacity = clamp((g-0.32)/0.12,0,1);
    const km = h/1000;
    alt.textContent = (km >= 10 ? Math.round(km) + ' КМ' : (km>=1 ? km.toFixed(1)+' КМ' : Math.round(h)+' М')) + '↓';
  }

  // прицел появляется на подлёте и плавно сжимается к центру по мере зума
  if(g > 0.6){
    const p = clamp((g - 0.6) / 0.35, 0, 1);
    const size = 260 - p*186;          // 260→74
    rec.style.width = rec.style.height = size + 'px';
    rec.style.opacity = clamp((g-0.6)/0.06, 0, 1);
  }
  // координаты печатаются ближе к концу
  if(g > 0.78 && coordtxt.textContent.length < COORD_FULL.length){
    const k = clamp((g - 0.78) / 0.16, 0, 1);
    coordtxt.textContent = COORD_FULL.slice(0, Math.floor(k*COORD_FULL.length));
    coord.style.opacity = 1;
  }
});

function finishSeq(){
  if(finished) return; finished = true;
  coordtxt.textContent = COORD_FULL; coord.style.opacity = 1;
  flash.animate([{opacity:0},{opacity:.92},{opacity:0}], {duration:850, easing:'ease-out'});
  logoEl.animate([{opacity:0},{opacity:1}], {duration:800, delay:340, fill:'forwards', easing:'ease-out'});
  setTimeout(()=>{ /* сюда — переход на сайт студии */ }, 1500);
}
skip.onclick = ()=>{ viewer.camera.cancelFlight(); finishSeq(); };

// как только первые тайлы готовы (не крутить по чёрному глобусу) — запускаем вращение,
// затем фаза spin сама перейдёт в влёт на Краснодар
let waited = 0;
const tick = setInterval(()=>{
  waited += 100;
  if(scene.globe.tilesLoaded || waited > 2500){ clearInterval(tick); phase = 'spin'; lastT = performance.now(); }
}, 100);
</script>
</body>
</html>
